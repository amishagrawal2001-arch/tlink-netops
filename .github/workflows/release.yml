name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build app
        run: npm run build

      - name: Package for macOS
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          # Retention 1 day — these are intermediate artifacts consumed by the
          # release job and then no longer needed. Default 90 days fills the
          # 500 MB free-tier quota in 1-2 releases.
          retention-days: 1
          name: netops-mac
          path: |
            dist/*.dmg
            dist/*.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build app
        run: npm run build

      - name: Package for Windows
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          # Retention 1 day — these are intermediate artifacts consumed by the
          # release job and then no longer needed. Default 90 days fills the
          # 500 MB free-tier quota in 1-2 releases.
          retention-days: 1
          name: netops-windows
          path: |
            dist/*.exe
            dist/*.msi

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libx11-dev libxkbfile-dev libsecret-1-dev rpm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build app
        run: npm run build

      - name: Package for Linux
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          # Retention 1 day — these are intermediate artifacts consumed by the
          # release job and then no longer needed. Default 90 days fills the
          # 500 MB free-tier quota in 1-2 releases.
          retention-days: 1
          name: netops-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  build-server:
    name: Build NetOps Server
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Compile TypeScript
        working-directory: server
        run: npx tsc

      - name: Install production dependencies only
        working-directory: server
        run: npm prune --production

      - name: Create server tarball
        run: |
          VERSION=$(node -p "require('./server/package.json').version")
          mkdir -p server-build/netops-server-${VERSION}
          cp server/package.json server/install.sh server/Dockerfile server/docker-compose.yml server-build/netops-server-${VERSION}/
          [ -f server/README.md ] && cp server/README.md server-build/netops-server-${VERSION}/ || true
          cp -R server/src server-build/netops-server-${VERSION}/src
          cp -R server/dist server-build/netops-server-${VERSION}/dist
          cp -R server/node_modules server-build/netops-server-${VERSION}/node_modules
          cd server-build
          tar czf netops-server-${VERSION}-linux.tar.gz netops-server-${VERSION}/
          echo "✅ Server tarball: netops-server-${VERSION}-linux.tar.gz ($(du -h netops-server-${VERSION}-linux.tar.gz | cut -f1))"

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          # Retention 1 day — these are intermediate artifacts consumed by the
          # release job and then no longer needed. Default 90 days fills the
          # 500 MB free-tier quota in 1-2 releases.
          retention-days: 1
          name: netops-server
          path: server-build/*.tar.gz

  release:
    name: Create Release
    needs: [build-mac, build-windows, build-linux, build-server]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "*.msi" -o -name "*.tar.gz" \)

      - name: Generate categorized changelog
        id: changelog
        run: |
          set -e
          # Find the previous tag (skip the current tag being released)
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1 || echo "")

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            echo "No previous tag — listing all commits up to HEAD"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
            echo "Generating changelog for ${RANGE}"
          fi

          {
            echo "## 🚀 What's New in ${CURRENT_TAG}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Since [${PREV_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${PREV_TAG})**"
              echo ""
            fi

            # Features
            FEATS=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^feat' || true)
            if [ -n "$FEATS" ]; then
              echo "### ✨ Features"
              echo "$FEATS"
              echo ""
            fi

            # Fixes
            FIXES=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^fix' || true)
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            # Performance
            PERF=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^perf' || true)
            if [ -n "$PERF" ]; then
              echo "### ⚡ Performance"
              echo "$PERF"
              echo ""
            fi

            # Refactor
            REFACTOR=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^refactor' || true)
            if [ -n "$REFACTOR" ]; then
              echo "### ♻️  Refactors"
              echo "$REFACTOR"
              echo ""
            fi

            # Docs
            DOCS=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^docs' || true)
            if [ -n "$DOCS" ]; then
              echo "### 📝 Documentation"
              echo "$DOCS"
              echo ""
            fi

            # Chores / CI
            CHORES=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^chore\|^ci\|^build' || true)
            if [ -n "$CHORES" ]; then
              echo "### 🔧 Chores & CI"
              echo "$CHORES"
              echo ""
            fi

            # Tests
            TESTS=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^test' || true)
            if [ -n "$TESTS" ]; then
              echo "### ✅ Tests"
              echo "$TESTS"
              echo ""
            fi

            echo "---"
            echo ""
            echo "### 📦 Artifacts"
            echo "- **macOS**: \`NetOps-*.dmg\` (Intel + Apple Silicon)"
            echo "- **Windows**: \`NetOps Setup *.exe\`"
            echo "- **Linux**: \`NetOps-*.AppImage\`, \`.deb\`, \`.rpm\`"
            echo "- **NetOps Server** (optional backend): \`netops-server-*-linux.tar.gz\`"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            fi
          } > CHANGELOG_RELEASE.md

          echo "Generated changelog:"
          cat CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            netops-mac/*
            netops-windows/*
            netops-linux/*
            netops-server/*
          body_path: CHANGELOG_RELEASE.md
          draft: false
