name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Each build job uploads its files DIRECTLY to the GitHub Release using
# softprops/action-gh-release@v2. No `actions/upload-artifact` / no
# `actions/download-artifact` — the previous "build → artifact → release"
# dance was using ~5 GB of artifact storage per release run and overflowing
# the free-tier 500 MB quota. Skipping artifacts entirely sidesteps that
# problem permanently.
#
# softprops/action-gh-release@v2 is idempotent: re-running a job updates
# its uploaded assets in place rather than failing or duplicating.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Generate the categorized changelog and create/update the Release with
  # notes ONCE, before any builds. Subsequent build jobs upload assets to
  # the same Release without touching the body.
  # ───────────────────────────────────────────────────────────────────────────
  prepare-release:
    name: Prepare Release Notes
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Generate categorized changelog
        run: |
          set -e
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1 || echo "")

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi

          {
            echo "## 🚀 What's New in ${CURRENT_TAG}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Since [${PREV_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${PREV_TAG})**"
              echo ""
            fi

            FEATS=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^feat' || true)
            if [ -n "$FEATS" ]; then echo "### ✨ Features"; echo "$FEATS"; echo ""; fi

            FIXES=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^fix' || true)
            if [ -n "$FIXES" ]; then echo "### 🐛 Bug Fixes"; echo "$FIXES"; echo ""; fi

            PERF=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^perf' || true)
            if [ -n "$PERF" ]; then echo "### ⚡ Performance"; echo "$PERF"; echo ""; fi

            REFACTOR=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^refactor' || true)
            if [ -n "$REFACTOR" ]; then echo "### ♻️  Refactors"; echo "$REFACTOR"; echo ""; fi

            DOCS=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^docs' || true)
            if [ -n "$DOCS" ]; then echo "### 📝 Documentation"; echo "$DOCS"; echo ""; fi

            CHORES=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^chore\|^ci\|^build' || true)
            if [ -n "$CHORES" ]; then echo "### 🔧 Chores & CI"; echo "$CHORES"; echo ""; fi

            TESTS=$(git log ${RANGE} --pretty=format:'- %s (%h)' --grep='^test' || true)
            if [ -n "$TESTS" ]; then echo "### ✅ Tests"; echo "$TESTS"; echo ""; fi

            echo "---"
            echo ""
            echo "### 📦 Artifacts"
            echo "- **macOS**: \`NetOps-*.dmg\` (Intel + Apple Silicon)"
            echo "- **Windows**: \`NetOps Setup *.exe\`"
            echo "- **Linux**: \`NetOps-*.AppImage\`, \`.deb\`, \`.rpm\`"
            echo "- **NetOps Server** (optional backend): \`netops-server-*-linux.tar.gz\`"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            fi
          } > CHANGELOG_RELEASE.md

      - name: Create / update Release with notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false

  # ───────────────────────────────────────────────────────────────────────────
  # macOS build → upload to Release
  # ───────────────────────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS
    needs: prepare-release
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build app
        run: npm run build
      - name: Package for macOS
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload macOS files to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: false

  # ───────────────────────────────────────────────────────────────────────────
  # Windows build → upload to Release
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: prepare-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build app
        run: npm run build
      - name: Package for Windows
        run: npx electron-builder --win --publish never
      - name: Upload Windows files to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
          fail_on_unmatched_files: false

  # ───────────────────────────────────────────────────────────────────────────
  # Linux build → upload to Release
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libx11-dev libxkbfile-dev libsecret-1-dev rpm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build app
        run: npm run build
      - name: Package for Linux
        run: npx electron-builder --linux --publish never
      - name: Upload Linux files to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          fail_on_unmatched_files: false

  # ───────────────────────────────────────────────────────────────────────────
  # NetOps server tarball → upload to Release
  # ───────────────────────────────────────────────────────────────────────────
  build-server:
    name: Build NetOps Server
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        working-directory: server
        run: npm install
      - name: Compile TypeScript
        working-directory: server
        run: npx tsc
      - name: Install production dependencies only
        working-directory: server
        run: npm prune --production
      - name: Create server tarball
        run: |
          VERSION=$(node -p "require('./server/package.json').version")
          mkdir -p server-build/netops-server-${VERSION}
          cp server/package.json server/install.sh server/Dockerfile server/docker-compose.yml server-build/netops-server-${VERSION}/
          [ -f server/README.md ] && cp server/README.md server-build/netops-server-${VERSION}/ || true
          cp -R server/src server-build/netops-server-${VERSION}/src
          cp -R server/dist server-build/netops-server-${VERSION}/dist
          cp -R server/node_modules server-build/netops-server-${VERSION}/node_modules
          cd server-build
          tar czf netops-server-${VERSION}-linux.tar.gz netops-server-${VERSION}/
          echo "✅ Server tarball: netops-server-${VERSION}-linux.tar.gz ($(du -h netops-server-${VERSION}-linux.tar.gz | cut -f1))"
      - name: Upload server tarball to Release
        uses: softprops/action-gh-release@v2
        with:
          files: server-build/*.tar.gz
          fail_on_unmatched_files: false
