name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install system dependencies for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libx11-dev libxkbfile-dev

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build main process
        run: npm run build:main

      - name: Build renderer
        run: npm run build:renderer

      - name: Check bundle size
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Build artifacts:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -sh app/dist/ renderer/dist/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libx11-dev libxkbfile-dev

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        continue-on-error: true
        run: npm test -- --ci --coverage 2>&1 | tee test-output.txt

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if grep -q "Test Suites:" test-output.txt 2>/dev/null; then
            grep "Test Suites:" test-output.txt >> $GITHUB_STEP_SUMMARY
            grep "Tests:" test-output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Tests could not be parsed" >> $GITHUB_STEP_SUMMARY
          fi
