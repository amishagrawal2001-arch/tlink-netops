version: "3.8"

services:
  tlink-netops:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DISPLAY=${DISPLAY:-:0}
    ports:
      - "3000:3000"
    command: npm run dev
    tty: true
    stdin_open: true
