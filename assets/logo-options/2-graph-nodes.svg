<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c1d"/>
      <stop offset="100%" style="stop-color:#1a0a3e"/>
    </linearGradient>
    <linearGradient id="link2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg2)"/>
  <!-- Subtle glow -->
  <circle cx="256" cy="240" r="200" fill="url(#glow)"/>
  <!-- Links -->
  <line x1="160" y1="160" x2="352" y2="160" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="160" y1="160" x2="256" y2="340" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="352" y1="160" x2="256" y2="340" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="160" y1="160" x2="100" y2="300" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="352" y1="160" x2="412" y2="300" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="340" x2="160" y2="400" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="256" y1="340" x2="352" y2="400" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Main nodes -->
  <circle cx="160" cy="160" r="30" fill="#7c3aed" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="352" cy="160" r="30" fill="#7c3aed" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="256" cy="340" r="30" fill="#7c3aed" stroke="#a78bfa" stroke-width="3"/>
  <!-- Inner icons (router-like) -->
  <line x1="148" y1="160" x2="172" y2="160" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="148" x2="160" y2="172" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="352" cy="160" r="10" fill="none" stroke="white" stroke-width="3"/>
  <rect x="245" y="329" width="22" height="22" rx="3" fill="none" stroke="white" stroke-width="3"/>
  <!-- Leaf nodes -->
  <circle cx="100" cy="300" r="16" fill="#a78bfa" opacity="0.7"/>
  <circle cx="412" cy="300" r="16" fill="#a78bfa" opacity="0.7"/>
  <circle cx="160" cy="400" r="12" fill="#a78bfa" opacity="0.5"/>
  <circle cx="352" cy="400" r="12" fill="#a78bfa" opacity="0.5"/>
  <!-- Leaf inner dots -->
  <circle cx="100" cy="300" r="5" fill="white" opacity="0.8"/>
  <circle cx="412" cy="300" r="5" fill="white" opacity="0.8"/>
  <circle cx="160" cy="400" r="4" fill="white" opacity="0.6"/>
  <circle cx="352" cy="400" r="4" fill="white" opacity="0.6"/>
</svg>
